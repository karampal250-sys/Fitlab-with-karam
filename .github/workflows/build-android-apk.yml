name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Fit-Plat with Karam APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 & accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android safe system bars & permissions
        run: |
          python3 - <<'EOF'
          import pathlib

          styles_path = pathlib.Path('android/app/src/main/res/values/styles.xml')
          if styles_path.exists():
              txt = styles_path.read_text()
              if 'xmlns:tools=' not in txt:
                  txt = txt.replace(
                      '<resources>',
                      '<resources xmlns:tools="http://schemas.android.com/tools">',
                      1,
                  )
              extra = (
                  '        <item name="android:fitsSystemWindows">true</item>\n'
                  '        <item name="android:windowOptOutEdgeToEdgeEnforcement" tools:targetApi="35">true</item>\n'
                  '        <item name="android:navigationBarColor">@android:color/black</item>\n'
              )
              if 'fitsSystemWindows' not in txt:
                  target = '<style name="AppTheme.NoActionBar"'
                  if target in txt:
                      idx = txt.index(target)
                      close_idx = txt.index('</style>', idx)
                      txt = txt[:close_idx] + extra + '    ' + txt[close_idx:]
                  else:
                      txt = txt.replace('</style>', extra + '    </style>', 1)
              styles_path.write_text(txt)

          manifest_path = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if manifest_path.exists():
              mtxt = manifest_path.read_text()
              perms = [
                  'android.permission.RECORD_AUDIO',
                  'android.permission.MODIFY_AUDIO_SETTINGS',
                  'android.permission.POST_NOTIFICATIONS',
              ]
              additions = ''.join(
                  f'    <uses-permission android:name="{p}" />\n'
                  for p in perms
                  if p not in mtxt
              )
              if additions and '<application' in mtxt:
                  mtxt = mtxt.replace('<application', additions + '    <application', 1)
                  manifest_path.write_text(mtxt)
          EOF

      - name: Apply app launcher icons
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -f "$dir/ic_launcher.png" ] && [ -f "public/pwa-192x192.png" ]; then
                cp public/pwa-192x192.png "$dir/ic_launcher.png"
              fi
              if [ -f "$dir/ic_launcher_round.png" ] && [ -f "public/pwa-192x192.png" ]; then
                cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
              fi
              if [ -f "$dir/ic_launcher_foreground.png" ] && [ -f "public/pwa-maskable-512x512.png" ]; then
                cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: fit-plat-with-karam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release AAB & Unsigned APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -x lintVitalRelease --no-daemon

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: fit-plat-with-karam-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fit-plat-with-karam-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Prepare direct download files
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/Fit-Plat-with-Karam.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/Fit-Plat-with-Karam.aab

      - name: Publish GitHub Release with Direct APK & AAB Links
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/Fit-Plat-with-Karam.apk release-files/Fit-Plat-with-Karam.aab --clobber
          else
            gh release create "$TAG" release-files/Fit-Plat-with-Karam.apk release-files/Fit-Plat-with-Karam.aab \
              --title "Fit-Plat with Karam $TAG" \
              --notes "Direct Android APK (install on phone) and AAB (Google Play Store)." \
              --latest
          fi
